name: Renovador Automatico de Links IPTV

on:
  schedule:
    - cron: '*/15 * * * *'  # Executa a cada 15 minutos
  workflow_dispatch:        # Permite rodar manualmente pelo painel

jobs:
  atualizar-links:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar Código do Repositório
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests
          playwright install chromium

      - name: Executar Robô de Captura
        run: python renovar_link.py

      - name: Salvar Alterações no GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add stream_config.json
          git commit -m "Auto-update: Link IPTV renovado [skip ci]" || exit 0
          git push
